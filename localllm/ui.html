<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>localllm</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14774c">
<style>
:root{--bg:#fbfbf9;--panel:#f1f1ec;--text:#1d1f1c;--muted:#5c6059;--line:#dcdcd4;--accent:#14774c;--accent-ink:#fff;--me:#e7f2ec;--code:#eceee8;--warn:#a5520a}
@media (prefers-color-scheme:dark){:root{--bg:#141614;--panel:#1c1f1c;--text:#e6e8e3;--muted:#9aa096;--line:#2e332e;--accent:#3dbb84;--accent-ink:#0b130e;--me:#1d2b23;--code:#242824;--warn:#e0a060}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;display:flex}
button,select,textarea,input{font:inherit;color:inherit}
aside{width:260px;flex:none;background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column}
aside header{padding:14px;display:flex;gap:8px;align-items:center}
aside header b{flex:1}
#sessions{flex:1;overflow:auto;padding:0 8px 8px}
.sess{display:flex;align-items:center;gap:4px;border-radius:8px;padding:6px 8px;cursor:pointer}
.sess:hover,.sess.on{background:var(--bg)}
.sess-open{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;text-align:start;padding:0;cursor:pointer}
.sess-del{opacity:0;border:0;background:none;cursor:pointer;color:var(--muted)}
.sess:hover .sess-del,.sess-del:focus-visible,.sess.on .sess-del{opacity:1}
#status{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);white-space:pre-line}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.top .grow{flex:1;min-width:0;display:flex;gap:6px;align-items:center}
.top label{white-space:nowrap}
.menu{display:none}
#log{flex:1;overflow:auto;padding:20px 16px}
.msg{max-width:780px;margin:0 auto 16px}
.msg.user .body{background:var(--me);border-radius:12px;padding:10px 14px;white-space:pre-wrap}
.msg.assistant .body{padding:2px 2px}
.msg .meta{font-size:12px;color:var(--muted);margin-top:4px}
.body pre{background:var(--code);padding:10px;border-radius:8px;overflow:auto}
.body code{background:var(--code);padding:1px 4px;border-radius:4px}
code{direction:ltr;unicode-bidi:isolate}
.body pre code{background:none;padding:0}
details.think{color:var(--muted);font-size:13px;margin-bottom:6px}
#files{max-width:780px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:6px}
#files:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;background:var(--panel)}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 4px}
.chip.busy{color:var(--muted)}
.sources{font-size:12px;color:var(--muted);margin-top:6px}
.sources details{display:inline-block;margin-inline-end:10px;vertical-align:top}
.sources details[open]{display:block;margin:4px 0}
.sources summary{cursor:pointer}
.sources blockquote{margin:4px 0 6px;padding:6px 10px;border-inline-start:3px solid var(--line);color:var(--text);white-space:pre-wrap;font-size:13px}
#chatview.drop{outline:2px dashed var(--accent);outline-offset:-8px}
.empty{max-width:560px;margin:12vh auto 0;text-align:center;color:var(--muted)}
.empty h1{color:var(--text);font-size:22px}
form{border-top:1px solid var(--line);padding:12px 16px}
.box{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;min-height:46px;max-height:40vh;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);max-width:260px;min-width:0;flex:1}
.warn{color:var(--warn)}
#login{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center}
#login div{background:var(--bg);padding:22px;border-radius:12px;width:min(380px,90vw)}
#login input{width:100%;margin:10px 0;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
.tabs{display:flex;gap:4px}
.tab{border:1px solid transparent;background:none;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.tab[aria-selected=true]{background:var(--panel);border-color:var(--line);color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
#chatview{flex:1;min-height:0;display:flex;flex-direction:column}
#models{flex:1;overflow:auto;padding:16px;display:none}
#models .intro{max-width:900px;margin:0 auto 12px;color:var(--muted)}
.mlist{max-width:900px;margin:0 auto;display:grid;gap:10px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.mcard.no{border-style:dashed}
.mcard h2{margin:0;font-size:15px}
.mcard .facts{font-size:13px;color:var(--muted)}
.mcard .act{grid-row:1/span 3;grid-column:2;align-self:center;text-align:end}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--code)}
.fit{font-size:12px;border-radius:999px;padding:2px 8px;border:1px solid currentColor}
.fit.fits{color:var(--accent)}.fit.spill{color:var(--warn)}.fit.no{color:var(--muted)}
.best{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--accent);color:var(--accent-ink)}
.cmd{font-size:12px;user-select:all;background:var(--code);padding:2px 6px;border-radius:4px}
progress{width:120px}
@media (max-width:760px){aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s}[dir=rtl] aside{inset:0 0 0 auto;transform:translateX(100%)}aside.open,[dir=rtl] aside.open{transform:none}.menu{display:inline-block}}
</style>
</head>
<body>
<aside id="side" aria-labelledby="side-title">
<header><b id="side-title">localllm</b><button class="btn" id="new" type="button" data-i18n="new_chat">New chat</button></header>
<nav id="sessions" aria-label="Chats" data-i18n-aria="chats"></nav>
<div id="status" role="status" aria-live="polite" data-i18n="status_loading">status: loading...</div>
</aside>
<main>
<h1 class="sr-only">localllm</h1>
<div class="top">
<button class="btn menu" id="menu" type="button" aria-label="Chats" data-i18n-aria="chats">&#9776;</button>
<div class="tabs" role="tablist" aria-label="View" data-i18n-aria="view">
<button class="tab" id="tab-chat" role="tab" type="button" aria-selected="true" aria-controls="chatview" data-i18n="tab_chat">Chat</button>
<button class="tab" id="tab-models" role="tab" type="button" aria-selected="false" aria-controls="models" tabindex="-1" data-i18n="tab_models">Models</button>
</div>
<label class="grow"><span data-i18n="model">Model</span> <select id="model"><option value="" data-i18n="automatic">automatic</option></select></label>
<label><input type="checkbox" id="think"> <span data-i18n="thinking">thinking</span></label>
</div>
<div id="chatview" role="tabpanel" aria-labelledby="tab-chat">
<div id="log" role="log" aria-live="polite" aria-busy="false" tabindex="0" aria-label="Chat" data-i18n-aria="tab_chat"></div>
<form id="form"><div id="files" aria-live="polite"></div><div class="box">
<button class="btn" id="attach" type="button" aria-label="Attach files" data-i18n-aria="attach" title="Attach files" data-i18n-title="attach"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
<input type="file" id="pick" multiple hidden accept=".pdf,.docx,.txt,.md,.markdown,.text">
<textarea id="input" rows="1" aria-label="Message" data-i18n-aria="message" placeholder="Message" title="Enter sends, Shift+Enter adds a line" data-i18n-placeholder="message" data-i18n-title="enter_hint"></textarea>
<button class="btn primary" id="send" type="submit" data-i18n="send">Send</button>
</div></form>
</div>
<section id="models" role="tabpanel" aria-labelledby="tab-models" aria-live="polite"></section>
</main>
<div id="login" role="dialog" aria-modal="true" aria-labelledby="login-title"><div><b id="login-title" data-i18n="key_title">This localllm asks for its key</b>
<p class="small" data-i18n="key_body">You are on another device. Use the key printed in the terminal of the PC running localllm.</p>
<input id="key" type="password" autocomplete="current-password" aria-label="API key" data-i18n-aria="api_key">
<button class="btn primary" id="keyok" type="button" data-i18n="unlock">Unlock</button></div></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const S = {id: null, title: "", messages: [], model: "", files: []};
let key = "", ctrl = null, catalog = {};
// ---- the page's words (#108): from /localllm/i18n, English where a translation is missing --------------------------
let L = {}, UI = "en";
function T(k, vars) {
  let s = L[k] || k;
  for (const n in vars || {}) s = s.split("{" + n + "}").join(String(vars[n]));
  return s;
}
function langName(code) {
  try { return new Intl.DisplayNames([UI], {type: "language"}).of(code) || code; } catch (e) { return code; }
}
async function loadStrings() {
  try {
    const d = await (await fetch("/localllm/i18n?lang=" + encodeURIComponent(navigator.language || ""))).json();
    L = d.strings || {}; UI = d.lang || "en";
    document.documentElement.lang = UI; document.documentElement.dir = d.dir || "ltr";
  } catch (e) { /* keep the English in the markup */ }
  document.querySelectorAll("[data-i18n]").forEach((el) => { if (L[el.dataset.i18n]) el.textContent = L[el.dataset.i18n]; });
  for (const [k, attr] of [["i18nPlaceholder", "placeholder"], ["i18nTitle", "title"], ["i18nAria", "aria-label"]])
    document.querySelectorAll(`[data-${k.replace(/[A-Z]/g, (c) => "-" + c.toLowerCase())}]`).forEach((el) => {
      if (L[el.dataset[k]]) el.setAttribute(attr, L[el.dataset[k]]);
    });
}
try { key = sessionStorage.getItem("localllm-key") || ""; } catch (e) {}
(function keyFromLink() {      // a QR code made with --qr-key opens /?key=...: keep it for this tab, drop it from the URL
  const k = new URLSearchParams(location.search).get("key");
  if (!k) return;
  key = k;
  try { sessionStorage.setItem("localllm-key", k); } catch (e) {}
  history.replaceState(null, "", location.pathname);
})();
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("/sw.js").catch(() => {});

function headers(extra) {
  const h = Object.assign({"Content-Type": "application/json", "X-Localllm-UI": "1"}, extra || {});
  if (key) h.Authorization = "Bearer " + key;
  return h;
}
async function api(path, opts) {
  const r = await fetch(path, Object.assign({headers: headers()}, opts || {}));
  if (r.status === 401) { askKey(); throw new Error("key needed"); }
  return r;
}
function askKey() { $("login").style.display = "flex"; $("key").focus(); }
$("key").addEventListener("keydown", (ev) => { if (ev.key === "Enter") $("keyok").click(); });
$("keyok").onclick = () => {
  key = $("key").value.trim();
  try { sessionStorage.setItem("localllm-key", key); } catch (e) {}
  $("login").style.display = "none"; $("input").focus(); boot();
};

function esc(s) { return s.replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]); }
function render(md) {
  // code blocks and inline code only; everything else stays plain text
  const parts = md.split(/```/);
  return parts.map((p, i) => {
    if (i % 2) { const nl = p.indexOf("\n"); return "<pre><code>" + esc(nl >= 0 ? p.slice(nl + 1) : p) + "</code></pre>"; }
    return esc(p).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
  }).join("");
}
function bubble(m) {
  const d = document.createElement("div");
  d.className = "msg " + m.role;
  d.innerHTML = (m.thinking && $("think").checked ? `<details class="think"><summary>${esc(T("thinking"))}</summary>${esc(m.thinking)}</details>` : "")
    + `<div class="body">${m.role === "user" ? esc(m.content) : render(m.content)}</div>`
    + (m.meta ? `<div class="meta">${esc(m.meta)}</div>` : "")
    + (m.sources && m.sources.length ? `<div class="sources">${esc(T("sources"))}: ` + m.sources.map((h) =>
      `<details><summary>[${h.n}] ${esc(h.name)} ${esc(h.loc)}</summary><blockquote>${esc(h.text)}</blockquote></details>`).join("") + "</div>" : "");
  return d;
}
function draw() {
  const log = $("log");
  log.innerHTML = "";
  if (!S.messages.length) {
    log.innerHTML = `<div class="empty"><h1>${esc(T("empty_title"))}</h1><p>${esc(T("empty_body")).replace("{path}",
      "<code>~/.localllm/sessions/</code>")}</p></div>`;
    return;
  }
  S.messages.forEach((m) => log.appendChild(bubble(m)));
  log.scrollTop = log.scrollHeight;
}

async function listSessions() {
  const r = await api("/localllm/sessions");
  const items = await r.json();
  const box = $("sessions");
  box.innerHTML = "";
  items.forEach((s) => {
    const d = document.createElement("div");
    d.className = "sess" + (s.id === S.id ? " on" : "");
    d.innerHTML = `<button type="button" class="sess-open" title="${esc(s.title)}"${s.id === S.id ? ' aria-current="true"' : ""}>`
      + `${esc(s.title || T("untitled"))}</button><button type="button" class="sess-del" aria-label="${esc(T("delete"))}: ${esc(s.title || T("untitled"))}">&times;</button>`;
    d.querySelector(".sess-open").onclick = () => open(s.id);
    d.querySelector(".sess-del").onclick = async () => {
      if (!confirm(T("delete_q"))) return;
      await api("/localllm/sessions/" + s.id, {method: "DELETE"});
      if (s.id === S.id) fresh();
      listSessions();
    };
    box.appendChild(d);
  });
}
async function open(id) {
  const r = await api("/localllm/sessions/" + id);
  Object.assign(S, {files: []}, await r.json());
  $("model").value = S.model || "";
  drawFiles();
  $("side").classList.remove("open");
  draw(); listSessions();
}
function fresh() { Object.assign(S, {id: null, title: "", messages: [], model: $("model").value, files: []}); drawFiles(); draw(); listSessions(); }
async function save() {
  if (!S.id) S.id = new Date().toISOString().replace(/[-:T.Z]/g, "").slice(0, 14) + "-" + Math.random().toString(36).slice(2, 6);
  if (!S.title) S.title = (S.messages.find((m) => m.role === "user") || {content: ""}).content.slice(0, 60);
  await api("/localllm/sessions/" + S.id, {method: "PUT", body: JSON.stringify(S)});
  listSessions();
}

async function send(text) {
  S.messages.push({role: "user", content: text});
  const reply = {role: "assistant", content: "", thinking: "", meta: ""};
  S.messages.push(reply);
  draw();
  const node = $("log").lastChild;
  const body = {messages: S.messages.slice(0, -1).map((m) => ({role: m.role, content: m.content})), stream: true};
  if (S.files.length) {          // #113: the passages go with this turn only; the saved chat keeps the question
    try {
      const f = await (await api("/localllm/docs/search", {method: "POST", body: JSON.stringify({q: text, ids: S.files.map((x) => x.id)})})).json();
      if (f.hits) { body.messages[body.messages.length - 1].content = f.message; reply.sources = f.hits; }
    } catch (e) { reply.meta = T("error", {msg: e.message}); }
  }
  if ($("model").value) body.model = $("model").value;
  ctrl = new AbortController();
  $("log").setAttribute("aria-busy", "true");
  $("send").textContent = T("stop");
  const t0 = performance.now();
  try {
    const r = await fetch("/v1/chat/completions", {method: "POST", headers: headers(), body: JSON.stringify(body), signal: ctrl.signal});
    if (r.status === 401) { askKey(); throw new Error("key needed"); }
    if (!r.ok) throw new Error((await r.text()).slice(0, 300));
    const who = r.headers.get("X-Localllm-Model") || "";
    const route = r.headers.get("X-Localllm-Route") || "local";
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "", timings = null;
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:") || line.includes("[DONE]")) continue;
        const d = JSON.parse(line.slice(5));
        if (d.timings) timings = d.timings;
        const delta = ((d.choices || [])[0] || {}).delta || {};
        reply.content += delta.content || "";
        reply.thinking += delta.reasoning_content || "";
      }
      node.replaceWith(bubble(reply));
      $("log").lastChild.scrollIntoView({block: "end"});
    }
    const speed = timings && timings.predicted_per_second ? `${timings.predicted_per_second.toFixed(1)} tok/s` : "";
    reply.meta = [who || (catalog.single || ""), route !== "local" ? route : "", speed, `${((performance.now() - t0) / 1000).toFixed(1)} s`].filter(Boolean).join(" · ");
  } catch (e) {
    if (e.name === "AbortError") reply.meta = T("stopped");
    else reply.meta = T("error", {msg: e.message});
  } finally {
    ctrl = null; $("send").textContent = T("send");
    $("log").setAttribute("aria-busy", "false");
    draw(); save();
  }
}

$("form").onsubmit = (ev) => {
  ev.preventDefault();
  if (ctrl) { ctrl.abort(); return; }
  const t = $("input").value.trim();
  if (!t) return;
  $("input").value = ""; $("input").style.height = "";
  send(t);
};
$("input").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $("form").requestSubmit(); }
});
$("input").addEventListener("input", (ev) => { ev.target.style.height = ""; ev.target.style.height = ev.target.scrollHeight + "px"; });
$("new").onclick = fresh;
$("menu").onclick = () => $("side").classList.toggle("open");
$("model").onchange = () => { S.model = $("model").value; };
$("think").onchange = draw;

// ---- chat with your files (#113): the paperclip or drop; indexed on this PC under ~/.localllm/docs, sources under each answer --
function drawFiles() {
  const box = $("files");
  box.innerHTML = "";
  S.files.forEach((f, i) => {
    const c = document.createElement("span");
    c.className = "chip" + (f.busy ? " busy" : "");
    c.innerHTML = esc(f.busy ? T("indexing", {name: f.name}) : f.name)
      + (f.busy ? "" : `<button type="button" aria-label="${esc(T("detach", {name: f.name}))}">&times;</button>`);
    if (!f.busy) c.querySelector("button").onclick = () => { S.files.splice(i, 1); drawFiles(); if (S.id) save(); };
    box.appendChild(c);
  });
}
async function upload(file, download) {
  const r = await fetch("/localllm/docs?name=" + encodeURIComponent(file.name) + (download ? "&download=1" : ""),
                        {method: "POST", headers: headers({"Content-Type": "application/octet-stream"}), body: file});
  if (r.status === 401) { askKey(); throw new Error("key needed"); }
  const d = await r.json();
  if (r.status === 409 && d.need === "pdf" && !download) {
    if (!confirm(T("pdf_q"))) throw new Error(d.error);
    return upload(file, true);
  }
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
async function attach(list) {
  for (const file of list) {
    const slot = {name: file.name, busy: true};
    S.files.push(slot); drawFiles();
    try {
      const m = await upload(file, false);
      S.files.splice(S.files.indexOf(slot), 1);
      if (!S.files.some((f) => f.id === m.id)) S.files.push({id: m.id, name: m.name, chunks: m.chunks});
    } catch (e) {
      S.files.splice(S.files.indexOf(slot), 1);
      alert(T("attach_failed", {name: file.name, msg: e.message}));
    }
    drawFiles();
  }
  if (S.id) save();
}
$("attach").onclick = () => $("pick").click();
$("pick").onchange = () => { attach([...$("pick").files]); $("pick").value = ""; };
$("chatview").addEventListener("dragover", (ev) => { ev.preventDefault(); $("chatview").classList.add("drop"); });
$("chatview").addEventListener("dragleave", () => $("chatview").classList.remove("drop"));
$("chatview").addEventListener("drop", (ev) => {
  ev.preventDefault(); $("chatview").classList.remove("drop");
  if (ev.dataTransfer && ev.dataTransfer.files.length) attach([...ev.dataTransfer.files]);
});

async function status() {
  if (document.hidden) return;
  try {
    const d = await (await api("/localllm/status")).json();
    if (!d.loaded) { $("status").textContent = T("unloaded"); return; }
    const gb = (v) => v == null ? "?" : v.toFixed(1) + " GB";
    const spill = d.spill_gb != null && d.spill_gb > d.spill_warn_gb;
    $("status").innerHTML = esc(`${d.running}\nVRAM ${gb(d.vram_gb)} · RAM ${gb(d.ram_gb)}`)
      + (spill ? `<br><span class="warn">${esc(T("spilled", {gb: gb(d.spill_gb)}))}</span>` : "")
      + (d.savings ? `<br>${esc(d.savings)}` : "")
      + downloadLine(d.download_state)
      + (d.notice ? `<br>${esc(d.notice)}` : "");                         // update notice (#120)
  } catch (e) { $("status").textContent = navigator.onLine === false || e instanceof TypeError ? T("offline") : T("status_unavailable"); }
}

// #116: the best model downloading behind the starter, from GET /localllm/status download_state
function downloadLine(st) {
  if (!st) return "";
  const v = {model: st.key, gb: (st.total_gb || 0).toFixed(1)};
  let t;
  if (st.status === "done") t = T("dl_done", v);
  else if (st.status === "switching") t = T("dl_switching", v);
  else if (st.status === "switched") t = T("dl_switched", {...v, s: st.switch_s});
  else if (st.status === "switch_failed") t = T("dl_switch_failed", v);
  else if (st.status === "failed") t = T("dl_failed", v);
  else {
    t = T("dl_progress", {...v, pct: Math.round(100 * (st.done_gb || 0) / (st.total_gb || 1))});
    if (st.eta_s != null && st.eta_s >= 0)
      t += " · " + (st.eta_s >= 90 ? T("dl_left_min", {n: Math.round(st.eta_s / 60)}) : T("dl_left_s", {n: Math.max(5, Math.round(st.eta_s / 5) * 5)}));
  }
  return `<br>${esc(t)}`;
}

// ---- Models tab (#107): what fits this PC, scores in its language, one-click download --------------------------------
const suiteName = (s) => L["suite_" + s] || s;              // suite_global, suite_math, ... in i18n.STRINGS
let modelsTimer = null;

function showTab(name) {
  const models = name === "models";
  $("tab-chat").setAttribute("aria-selected", String(!models));
  $("tab-models").setAttribute("aria-selected", String(models));
  $("tab-chat").tabIndex = models ? -1 : 0;
  $("tab-models").tabIndex = models ? 0 : -1;
  $("chatview").style.display = models ? "none" : "flex";
  $("models").style.display = models ? "block" : "none";
  if (models) loadModels(); else clearTimeout(modelsTimer);
}
$("tab-chat").onclick = () => showTab("chat");
$("tab-models").onclick = () => showTab("models");
document.querySelector(".tabs").addEventListener("keydown", (ev) => {     // arrow keys move between tabs
  if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
  const next = ev.target.id === "tab-chat" ? "models" : "chat";
  showTab(next); $("tab-" + next).focus();
});

function modelCard(m, info) {
  const d = document.createElement("div");
  d.className = "mcard " + m.fit;
  const unit = (s) => s === "translate" ? " chrF++" : "%";
  const badges = Object.keys(m.badges).sort().map((s) =>
    `<span class="badge">${esc(suiteName(s))} ${m.badges[s].toFixed(1)}${unit(s)}</span>`).join("");
  const facts = [T("gb_download", {gb: m.gb}), m.tok_s ? `~${m.tok_s} tok/s` : "",
    m.fit === "spill" ? T("experts_ram", {n: m.experts_in_ram}) : "", m.qat ? T("qat") : "",
    m.below_floor ? T("below_floor") : ""].filter(Boolean).join(" · ");
  let act;
  if (m.active) act = `<span class="badge">${esc(T("running"))}</span>`;
  else if (m.download && m.download.state === "downloading")
    act = `<progress max="100" value="${m.download.pct}" aria-label="${esc(T("downloading", {key: m.key}))}"></progress> ${m.download.pct}%`;
  else if (m.downloaded || (m.download && m.download.state === "done"))
    act = `${esc(T("downloaded"))}<br>${esc(T("run_it"))} <code class="cmd">localllm --ui --model ${esc(m.key)}</code>`;
  else if (m.fit === "no") act = "";
  else act = `<button class="btn" type="button" data-dl="${esc(m.key)}">${esc(T("download_btn", {gb: m.gb}))}</button>`
    + (m.download && m.download.state === "error" ? `<br><span class="warn">${esc(m.download.error)}</span>` : "");
  d.innerHTML = `<h2>${esc(m.key)} ${m.key === info.best ? `<span class="best">${esc(T("best"))}</span>` : ""}</h2>`
    + `<div class="act">${act}</div>`
    + `<div><span class="fit ${m.fit}">${esc(T("fit_" + m.fit))}</span> <span class="facts">${esc(facts)}</span></div>`
    + `<div class="badges">${m.score != null ? `<span class="badge"><b>${esc(T("score_in", {score: m.score, lang: langName(info.lang)}))}</b></span>` : `<span class="badge">${esc(T("not_measured", {lang: langName(info.lang)}))}</span>`}${badges}</div>`
    + (m.note ? `<div class="facts">${esc(m.note)}</div>` : "");
  const b = d.querySelector("[data-dl]");
  if (b) b.onclick = async () => {
    b.disabled = true; b.textContent = T("starting");
    try { await api(`/localllm/models/${encodeURIComponent(m.key)}/download`, {method: "POST"}); } catch (e) {}
    loadModels();
  };
  return d;
}

async function loadModels() {
  clearTimeout(modelsTimer);
  let info;
  try { info = await (await api("/localllm/models")).json(); } catch (e) { $("models").textContent = T("models_unavailable"); return; }
  const box = $("models"), focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.dl : null;
  box.innerHTML = `<p class="intro">${esc(T("models_intro", {vram: info.vram_gb, ram: info.ram_free_gb, lang: langName(info.lang)}))}</p>`;


  const list = document.createElement("div");
  list.className = "mlist";
  info.models.forEach((m) => list.appendChild(modelCard(m, info)));
  box.appendChild(list);
  if (focused) { const again = box.querySelector(`[data-dl="${CSS.escape(focused)}"]`); if (again) again.focus(); }
  if (info.models.some((m) => m.download && m.download.state === "downloading")) modelsTimer = setTimeout(loadModels, 2000);
}

async function boot() {
  await loadStrings();
  try {
    catalog = await (await api("/localllm/catalog")).json();
    const sel = $("model");
    sel.length = 1;
    (catalog.models || []).forEach((m) => {
      const o = document.createElement("option");
      o.value = m.key;
      o.textContent = `${m.key} · ${m.gb} GB · ~${m.tok_s} tok/s` + (m.score != null ? ` · ${m.score}% ${m.lang}` : "");
      sel.appendChild(o);
    });
    if (!catalog.choosable && catalog.single) { sel.options[0].textContent = catalog.single; sel.length = 1; }
    sel.disabled = !catalog.choosable;
    if (!catalog.choosable) sel.title = T("one_model");
    draw(); await listSessions(); status();
  } catch (e) { /* askKey() was shown */ }
}
setInterval(status, 15000);
boot();
</script>
