[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "make-localllm-easier"
version = "0.8.1"
description = "One command runs the best local AI your PC can handle: measured model picks + a tuned llama.cpp (AMD, NVIDIA, Intel, Apple)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["llm", "local-llm", "llama.cpp", "vulkan", "amd", "gguf", "thai", "offline-ai"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
pdf = ["pypdf==6.19.0"]        # chat with PDFs (#113); without it localllm asks and fetches this exact wheel, SHA-256 checked

mcp = ["mcp>=2.3,<3; python_version>='3.10'", "anyio>=4; python_version>='3.10'"]   # `localllm mcp` (#183)

[project.urls]
Homepage = "https://github.com/phonology024/make-localllm-easier"

[project.scripts]
localllm = "localllm.cli:main"
make-localllm-easier = "localllm.cli:main"

[tool.setuptools]
packages = ["localllm"]

[tool.setuptools.package-data]
localllm = ["platforms.json", "ui.html", "fonts/*.woff2", "fonts/OFL.txt", "fonts/SOURCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]          # tools/agent_bench/fixture/tests belongs to the benchmark's fixture project
