name: pages
# Build the website from the repo data and publish it to GitHub Pages (#74). Standard library only, no install step.
on:
  push:
    branches: [main]
    paths: [site/**, data/**, localllm/catalog.py, localllm/__init__.py, tools/headline.py,
            tools/footprint_results.jsonl, README.md, llms.txt, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        env:
          SITE_URL: https://phonology024.github.io/make-localllm-easier
        run: python site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
