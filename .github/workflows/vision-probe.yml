name: vision-probe
on:
  push:
    branches: [claude/issue-44-vision]
    paths: [.github/workflows/vision-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in unsloth/gemma-4-26B-A4B-it-qat-GGUF unsloth/Qwen3.8-27B-GGUF ggml-org/gemma-4-E2B-it-GGUF unsloth/Qwen3.5-2B-GGUF unsloth/gemma-4-E2B-it-GGUF; do
            echo "== $r"; curl -s "https://huggingface.co/api/models/$r/tree/main" | python3 -c 'import json,sys; [print(f["path"], f.get("size")) for f in json.load(sys.stdin) if "mmproj" in f["path"].lower() or f["path"].endswith(".gguf")]' || true
          done
          for q in maxm xgqa cvqa mtvqa xm3600 marvl; do
            echo "== datasets search $q"
            curl -s "https://huggingface.co/api/datasets?search=$q&limit=15&full=true" | python3 -c '
          import json,sys
          for d in json.load(sys.stdin):
              cd=d.get("cardData") or {}
              print(d["id"], "license=", cd.get("license"), "langs=", str(cd.get("language"))[:120], "dl=", d.get("downloads"))'
          done
          for ds in floschne/maxm floschne/xgqa; do
            echo "== splits $ds"; curl -s "https://datasets-server.huggingface.co/splits?dataset=$ds" | head -c 2000; echo
            echo "== first rows $ds"; curl -s "https://datasets-server.huggingface.co/first-rows?dataset=$ds&config=default&split=th" | head -c 2500; echo
          done
